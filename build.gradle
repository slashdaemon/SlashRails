plugins {
    id "java"
    id "fabric-loom" version "1.13.6" apply false
    id "net.neoforged.moddev" version "2.0.124" apply false
}

allprojects {
    group = project.maven_group
    version = project.mod_version

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            name = "ParchmentMC"
            url = "https://maven.parchmentmc.org"
        }
    }
}

subprojects {
    apply plugin: "java"

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}

// Every band this composite builds. Each is versions/<name>/ = build.gradle (variant list) +
// gradle.properties (coordinates). See CLAUDE.md "Bands" for what each covers.
def bands = [
        "1.21-fabric",
        "1.21.1-fabric",
        "1.21.1-neoforge",
        "1.21.2-fabric",
        "1.21.3-neoforge",
        "1.21.4-fabric",
        "1.21.4-neoforge",
        "1.21.5-fabric",
        "1.21.5-neoforge",
]

tasks.register("buildAll") {
    group = "build"
    description = "Runs core tests and builds every band; jars land in build/release/."
    dependsOn ":core:test"
    bands.each { dependsOn ":versions:${it}:build" }
}

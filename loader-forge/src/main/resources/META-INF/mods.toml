# Forge 1.20.1 mod manifest. Also read by NeoForge 1.20.1 (47.1.x), which kept the mods.toml name,
# the `mandatory` dependency field and the net.minecraftforge packages. Mixin configs are named by
# the jar manifest (MixinConfigs); [[mixins]] here would be ignored on 1.20.1.
modLoader = "javafml"
loaderVersion = "[47,)"
license = "CC-BY-4.0"
issueTrackerURL = "https://github.com/slashdaemon/SlashRails/issues"

[[mods]]
modId = "slashrails"
version = "${version}"
displayName = "SlashRails"
authors = "Slash"
logoFile = "assets/slashrails/icon.png"
description = '''
Turns zigzag rail staircases into smooth curves: smooth to look at and smooth to ride in a vanilla minecart. Use the Track Smoother on a rail.
'''
displayURL = "https://theblock.academy"

[[dependencies.slashrails]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.slashrails]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

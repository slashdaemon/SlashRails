// Composes one Fabric band JAR. A band's build.gradle is its variant list plus this file:
//
//   plugins { id "fabric-loom" }
//   ext.rails = [compat: [...], loader: [...]]
//   apply from: "${rootDir}/gradle/fabric-band.gradle"
//
// See gradle/band-sources.gradle for what the variant lists mean.

ext.railsLoader = "fabric"
// Server-only mode (rails.polymer): clients without the mod may join, via Polymer. Every other band
// requires the mod on the client. The variant is picked here so band files only set the flag.
project.rails.loader = (project.rails.loader ?: []) + [project.rails.polymer ? "vanilla-polymer" : "vanilla-required"]
// The repo root. A nested 26.x build (versions/26.x/) passes it as -PrailsRoot / gradle.properties.
ext.railsRootDir = project.hasProperty("railsRoot") ? rootProject.file(project.railsRoot) : rootProject.projectDir
apply from: new File(project.railsRootDir, "gradle/band-sources.gradle")

version = ""

base {
    archivesName = "${project.archives_base_name}-${project.mod_version}+mc${project.minecraft_version}-fabric"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.railsJava
    it.options.encoding = "UTF-8"
}

loom {
    splitEnvironmentSourceSets()

    runs {
        // Headless instead of --nogui (no GUI either way): LocalServer's testkit force-kills every
        // java process whose command line contains "nogui" when it switches bands.
        server {
            serverWithGui() // stops Loom adding "nogui"; headless means no GUI appears anyway
            vmArg "-Djava.awt.headless=true"
        }
        // Dev-only scripted screenshots (common-mc VisualTest): needs run/saves/visual-world.
        visualTest {
            client()
            name "Visual Test"
            vmArg "-Dslashrails.visualtest=true"
            programArgs "--quickPlaySingleplayer", "visual-world"
        }
        // Dev-only multiplayer sync check against the dev server (scripts/mp-test.sh).
        mpTest {
            client()
            name "MP Test"
            vmArg "-Dslashrails.mptest=true"
            programArgs "--quickPlayMultiplayer", "127.0.0.1:25590", "--username", "SlashTester"
            runDir "run-client"
        }
        if (project.rails.devtools) {
            // Dev-only store-gallery demo takes (common-mc/src/devtools; scripts/record-demos.sh).
            demo {
                client()
                name "Demo"
                vmArg "-Dslashrails.demo=${project.findProperty('demo') ?: 'click'}"
                vmArg "-Dslashrails.ffmpeg=${project.findProperty('ffmpeg') ?: 'ffmpeg'}"
                programArgs "--quickPlaySingleplayer", "demo-world", "--width", "1920", "--height", "1080"
                runDir "run-demo"
            }
        }
    }

    mods {
        slashrails {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { name = "Nucleoid"; url = "https://maven.nucleoid.xyz/"; content { includeGroup "eu.pb4" } }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

// MC 26.x ships unobfuscated: Loom's non-remapping plugin (net.fabricmc.fabric-loom), no mappings,
// plain configurations and no remapJar. Those bands set unobfuscated=true.
def unobf = project.findProperty("unobfuscated") == "true"
def modImpl = unobf ? "implementation" : "modImplementation"
def modLocal = unobf ? "localRuntime" : "modLocalRuntime"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!unobf) mappings loom.officialMojangMappings()
    add(modImpl, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modImpl, "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    if (project.rails.polymer) {
        // Nested, like SlashSlabs: core (item overlay), resource pack (mod assets), AutoHost (serves the pack).
        ["polymer-core", "polymer-resource-pack", "polymer-autohost"].each {
            add(modImpl, "eu.pb4:${it}:${project.polymer_version}")
            include "eu.pb4:${it}:${project.polymer_version}"
        }
    }

    // Compatibility testing only, never bundled: -Psodium=<version> [-Piris=<version>]
    // e.g. -Psodium=mc1.21.1-0.6.13-fabric -Piris=1.8.8+1.21.1-fabric
    if (project.hasProperty("sodium")) add(modLocal, "maven.modrinth:sodium:${project.sodium}")
    if (project.hasProperty("iris")) {
        add(modLocal, "maven.modrinth:iris:${project.iris}")
        // Iris nests these; in dev they must be on the classpath explicitly (Iris docs).
        localRuntime "org.anarres:jcpp:1.4.14"
        localRuntime "io.github.douira:glsl-transformer:2.0.1"
        localRuntime "org.antlr:antlr4-runtime:4.13.1"
    }
}

sourceSets.main.java.srcDir(project.railsMainJava)
sourceSets.client.java.srcDir(project.railsClientJava)
sourceSets.main.resources.srcDirs += project.railsResources

processResources {
    def props = project.railsMixinExpand + [
            version          : project.mod_version,
            minecraft_dep    : project.minecraft_dep,
            java_version     : project.railsJava.toString(),
    ]
    inputs.properties props
    filesMatching(["fabric.mod.json", "slashrails.mixins.json", "slashrails-client.mixins.json"]) {
        expand props
    }
}

jar {
    from(new File(project.railsRootDir, "LICENSE")) { rename { "${it}_slashrails" } }
}

// Every band's shipping jar is copied to build/release/ so there is one place to look.
tasks.named(unobf ? "jar" : "remapJar").configure { t ->
    t.doLast {
        if (project.hasProperty("noRelease")) return // -PnoRelease: experiments stay out of build/release
        def releaseDir = new File(project.railsRootDir, "build/release")
        releaseDir.mkdirs()
        def jar = t.archiveFile.get().asFile
        java.nio.file.Files.copy(jar.toPath(), new File(releaseDir, jar.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

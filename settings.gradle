pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'slashrails'

// Pure-Java curve math (no Minecraft), unit-tested. Bands compile its sources in directly.
include 'core'

// Shared source trees (core/, common-mc/, compat/, loader-*/) are not Gradle projects: each band
// compiles them in via gradle/band-sources.gradle.
include 'versions:1.21.1-fabric'
include 'versions:1.21.1-neoforge'
include 'versions:1.21-fabric'
include 'versions:1.21.2-fabric'
include 'versions:1.21.3-neoforge'
include 'versions:1.21.4-fabric'
include 'versions:1.21.4-neoforge'
include 'versions:1.21.5-fabric'
include 'versions:1.21.5-neoforge'

plugins {
    id "fabric-loom"
}

version = ""

base {
    archivesName = "${rootProject.archives_base_name}-${rootProject.mod_version}+mc${project.minecraft_version}-fabric"
}

loom {
    splitEnvironmentSourceSets()

    runs {
        // Headless instead of --nogui (no GUI either way): LocalServer's testkit force-kills every
        // java process whose command line contains "nogui" when it switches bands.
        server {
            serverWithGui() // stops Loom adding "nogui"; headless means no GUI appears anyway
            vmArg "-Djava.awt.headless=true"
        }
        // Dev-only scripted screenshots (common-mc VisualTest): needs run/saves/visual-world.
        // Dev-only multiplayer sync check against the dev server (scripts/mp-test.sh).
        mpTest {
            client()
            name "MP Test"
            vmArg "-Dslashtracks.mptest=true"
            programArgs "--quickPlayMultiplayer", "127.0.0.1:25590", "--username", "SlashTester"
            runDir "run-client"
        }
        visualTest {
            client()
            name "Visual Test"
            vmArg "-Dslashtracks.visualtest=true"
            programArgs "--quickPlaySingleplayer", "visual-world"
        }
    }

    mods {
        slashtracks {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // Compatibility testing only, never bundled: -Psodium=<version> [-Piris=<version>]
    // e.g. -Psodium=mc1.21.1-0.6.13-fabric -Piris=1.8.8+1.21.1-fabric
    if (project.hasProperty("sodium")) modLocalRuntime "maven.modrinth:sodium:${project.sodium}"
    if (project.hasProperty("iris")) {
        modLocalRuntime "maven.modrinth:iris:${project.iris}"
        // Iris nests these; in dev they must be on the classpath explicitly (Iris docs).
        localRuntime "org.anarres:jcpp:1.4.14"
        localRuntime "io.github.douira:glsl-transformer:2.0.1"
        localRuntime "org.antlr:antlr4-runtime:4.13.1"
    }

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Shared sources are compiled directly into this band (against this band's MC version).
def root = rootProject.projectDir
sourceSets.main.java.srcDirs += ["${root}/core/src/main/java", "${root}/common-mc/src/main/java", "${root}/loader-fabric/src/main/java"]
sourceSets.main.resources.srcDirs += ["${root}/common-mc/src/main/resources", "${root}/loader-fabric/src/main/resources"]
sourceSets.client.java.srcDirs += ["${root}/common-mc/src/client/java", "${root}/loader-fabric/src/client/java"]
sourceSets.client.resources.srcDirs += ["${root}/common-mc/src/client/resources"]

processResources {
    inputs.property "version", rootProject.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": rootProject.mod_version
    }
}

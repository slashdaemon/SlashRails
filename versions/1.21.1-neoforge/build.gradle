plugins {
    id "net.neoforged.moddev"
}

version = ""

base {
    archivesName = "${rootProject.archives_base_name}-${rootProject.mod_version}+mc${project.minecraft_version}-neoforge"
}

neoForge {
    version = project.neoforge_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    runs {
        client { client() }
        // Headless instead of --nogui (no GUI either way): LocalServer's testkit force-kills every
        // java process whose command line contains "nogui" when it switches bands.
        server {
            server()
            systemProperty "java.awt.headless", "true"
        }
        // Dev-only scripted screenshots (common-mc VisualTest): needs run/saves/visual-world.
        visualTest {
            client()
            systemProperty "slashrails.visualtest", "true"
            programArguments.addAll("--quickPlaySingleplayer", "visual-world")
        }
    }
    mods {
        slashrails {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

// Compatibility testing only, never bundled: -Psodium=<version> [-Piris=<version>]
// e.g. -Psodium=mc1.21.1-0.6.13-neoforge -Piris=1.8.8+1.21.1-neoforge
dependencies {
    if (project.hasProperty("sodium")) runtimeOnly "maven.modrinth:sodium:${project.sodium}"
    if (project.hasProperty("iris")) runtimeOnly "maven.modrinth:iris:${project.iris}"
}

// NeoForge has no Loom-style client split: client sources join main and are kept off
// dedicated servers by the mixin "client" array and Dist.CLIENT-only entrypoints.
def root = rootProject.projectDir
sourceSets.main.java.srcDirs += ["${root}/core/src/main/java", "${root}/common-mc/src/main/java",
        "${root}/common-mc/src/client/java", "${root}/loader-neoforge/src/main/java"]
sourceSets.main.resources.srcDirs += ["${root}/common-mc/src/main/resources", "${root}/common-mc/src/client/resources",
        "${root}/loader-neoforge/src/main/resources"]

processResources {
    inputs.property "version", rootProject.mod_version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": rootProject.mod_version,
                "neoforge_version": project.neoforge_version,
                "minecraft_version": project.minecraft_version
    }
}

modLoader = "javafml"
loaderVersion = "[2,)"
license = "ARR"

[[mods]]
modId = "slashrails"
version = "${version}"
displayName = "SlashRails"
authors = "Slash"
logoFile = "assets/slashrails/icon.png"
description = '''
Turns zigzag rail staircases into smooth curves: smooth to look at and smooth to ride in a vanilla minecart. Use the Track Smoother on a rail.
'''
displayURL = "https://theblock.academy"

[[mixins]]
config = "slashrails.mixins.json"

[[mixins]]
config = "slashrails-client.mixins.json"

[[dependencies.slashrails]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.slashrails]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "BOTH"

pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// MC 26.3 (unobfuscated, JDK 25). A nested build with its own Gradle wrapper: Loom 1.17.21 cannot share
// a plugin classpath with the parent build's Loom 1.13. The parent's buildAll runs it through its
// build263 task. Both subprojects compile the same shared tree as every other band.
rootProject.name = 'slashrails-26.3'
include 'band-fabric'
include 'band-neoforge'

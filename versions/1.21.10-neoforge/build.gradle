plugins { id "net.neoforged.moddev" }
ext.rails = [
        compat : ["cart-behavior", "chunk-flags", "item-setid", "recipe-1212", "nbt-optional", "store-codec", "savedtype-string", "ids-factory", "sprite-atlasmanager", "tooltip-display", "shot-scale"],
        loader : ["cartext-rail", "model-blockstate", "overlay-afterparticles"],
        renames: [(/BuiltInRegistries\.(\w+)\.get\(/): 'BuiltInRegistries.$1.getValue(',
                  (/startRiding\((\w+), true\)/)     : 'startRiding($1, true, true)'],
]
apply from: "${rootDir}/gradle/neoforge-band.gradle"
